# Left4Chat (Velocity)
#
# Everything below was hardcoded in the BungeeCord build. Fill in the Redis
# section before first use -- the defaults point at localhost and will simply
# log a warning on every event if nothing is listening there.

redis:
  host: 127.0.0.1
  port: 6379
  # Leave blank if the server has no requirepass / ACL user.
  password: ''
  username: ''
  database: 0
  timeout-millis: 2000
  max-connections: 8
  # Channel the Discord bot subscribes to for join/leave messages.
  chat-channel: 'minecraft.chat'
  # Key holding the JSON array of online players.
  player-list-key: 'minecraft.players'

player-list:
  # How long to wait after a join/leave/switch before writing the key. The proxy
  # player collection has not settled at the instant the event fires.
  publish-delay-millis: 1000
  # Republish on a timer regardless of events, so a dropped write cannot leave
  # the Discord bot showing a stale roster. 0 disables it.
  refresh-interval-seconds: 0

motd:
  enabled: true
  # Sent on the player's first backend connection. Add a delay only if something
  # else on the backend is clearing chat on join.
  delay-millis: 0
  lines:
    - '&3&m-<----------------------------------->-'
    - '&6Welcome back, &c{player}&6.'
    - ''
    - '&6Type &c/help &6to view the help menu.'
    - ''
    - '&6To switch server, type &c/game&6.'
    - '&3&m-<----------------------------------->-'

# Reconnect players to the server they were last on (the old proxy's
# reconnect_yaml module). Last-seen servers are kept in a Redis hash, so they
# survive proxy restarts. Excluded servers are neither recorded nor restored;
# players coming from one land on the hub via the normal try order.
last-server:
  enabled: true
  redis-key: 'minecraft.lastserver'
  excluded-servers: []

# Vote rewards. Requires NuVotifier on this proxy; when it receives a vote,
# the broadcast is announced to the whole network and each server listed under
# `commands` has its console commands published over Redis to the Paper-side
# Left4Chat console relay (minecraft.console.<server>.in), which runs them.
# {player} and {service} are substituted in the broadcast and the commands.
votes:
  enabled: true
  broadcast: '&d{player} &avoted on &d{service} &aand got &2$100 &ain game!'
  # Must match the Paper-side Left4Chat's redis.keys.console-channel-format.
  console-channel-format: 'minecraft.console.{server}.in'
  # Server name -> console command(s) to run there. Server names must match the
  # Paper-side Left4Chat's server-name, not necessarily velocity.toml.
  commands:
    survival:
      - 'eco give {player} 100'

# Short server-switch commands (the old proxy's BungeeAliases). Each entry is
# either `command: server` or a block with `server` and an optional
# `permission`. Server names must match velocity.toml (case-insensitive).
aliases:
  hub: hub
  lobby: hub
  survival: survival
  creative: creative
  partygames: partygames
  build:
    server: build
    permission: left4craft.build

# {player} and {server} are substituted. Legacy '&' colour codes are supported.
messages:
  join: '&8[&2+&8] &7{player} joined'
  leave: '&8[&4-&8] &7{player} left'
  switched-to: '&8[&3<&8] &7{player} switched to {server}'
  switched-from: '&8[&3>&8] &7{player} switched from {server}'
  alias-connecting: '&6Switching to &c{server}&6.'
  alias-already-connected: '&6You are already connected to &c{server}&6.'
  alias-no-permission: '&cYou do not have permission to connect to {server}'
  alias-unknown-server: '&c{server} is not available right now.'
